name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate source and assets
        run: python tools/check-source.py
      - name: Build and run orientation tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I src tools/dev/orientation-test.cpp -o /tmp/velox-orientation-test
          /tmp/velox-orientation-test
